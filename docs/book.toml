[book]
title = "KyQuickStart AI Manual"
authors = ["Busnes.app"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/Busnes-app/KyQuickStart-AI"
edit-url-template = "https://github.com/Busnes-app/KyQuickStart-AI/edit/master/docs/{path}"

[output.html.search]
enable = true

[output.html.print]
enable = true
