name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x kyqs-ai bin/* test/*.sh
      - run: test/unit.sh
      - run: test/e2e.sh
      - run: test/ssh-policy.sh

  macos:
    # The launcher runs on operator workstations: bash 3.2 and BSD tools.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: test/unit.sh
      - run: bash -n kyqs-ai && ./kyqs-ai help >/dev/null

  kube-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false # This fixture uses only the standard library, with no go.sum.
      - run: test/kube-tls.sh

  kube:
    # A real cluster (kind, preinstalled on the runner) for add-cluster's ServiceAccount.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kyquickstart release binary, pinned by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.4.2 -R Busnes-app/KyQuickStart -p kyquickstart-0.4.2-linux-amd64 -O "$RUNNER_TEMP/kyquickstart"
          echo "3f8fdec3ba7d8a63ad8d1eb88e172137b33789c79f7c867360b26365ec463ea6  $RUNNER_TEMP/kyquickstart" | sha256sum -c
          chmod +x "$RUNNER_TEMP/kyquickstart"
      - run: KYQS_STRONG_KUBE_TLS=1 KYQS_TEST_KYQUICKSTART=$RUNNER_TEMP/kyquickstart test/kube.sh
